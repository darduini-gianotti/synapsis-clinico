<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="synTealKids" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="synAmberKids" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="synPurpleKids" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glowKids" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#090d16" rx="24" />

  <!-- SÍMBOLO: Sinapse Psi & Neurodesenvolvimento Infantil -->
  <g transform="translate(40, 24)">
    <circle cx="96" cy="96" r="64" fill="url(#synTealKids)" opacity="0.20" filter="url(#glowKids)" />
    
    <rect x="20" y="20" width="152" height="152" rx="40" fill="#0f172a" stroke="url(#synTealKids)" stroke-width="2.5" />
    
    <!-- Tronco central do Psi -->
    <line x1="96" y1="46" x2="96" y2="146" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round" />
    
    <!-- Arco sináptico -->
    <path d="M 54 78 C 54 126, 138 126, 138 78" fill="none" stroke="url(#synPurpleKids)" stroke-width="5.5" stroke-linecap="round" />
    
    <!-- Traço horizontal da base -->
    <line x1="72" y1="146" x2="120" y2="146" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round" />

    <!-- Nós neurais luminosos -->
    <circle cx="96" cy="46" r="7.5" fill="#f59e0b" filter="url(#glowKids)" />
    <circle cx="54" cy="78" r="6.5" fill="#2dd4bf" filter="url(#glowKids)" />
    <circle cx="138" cy="78" r="6.5" fill="#a855f7" filter="url(#glowKids)" />
    <circle cx="96" cy="108" r="5" fill="#ffffff" />
    <circle cx="96" cy="108" r="9" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.8" />
  </g>

  <!-- TIPOGRAFIA: Synapsis Kids -->
  <g transform="translate(255, 110)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
      Synapsis
    </text>
    
    <!-- Badge KIDS -->
    <rect x="270" y="-46" width="125" height="38" rx="10" fill="rgba(245, 158, 11, 0.16)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="332" y="-22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="800" fill="#f59e0b" letter-spacing="3" text-anchor="middle">
      KIDS
    </text>
    
    <!-- Sub-tagline -->
    <text x="4" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="2.2">
      ROTINA VISUAL • AUTONOMIA • PREVISIBILIDADE
    </text>
  </g>
</svg>
