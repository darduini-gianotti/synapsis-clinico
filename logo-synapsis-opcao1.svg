<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="synTeal1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="synPurple1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#090d16" rx="24" />

  <!-- SÍMBOLO: Sinapse Psi Tecnológica -->
  <g transform="translate(40, 24)">
    <!-- Glow de fundo -->
    <circle cx="96" cy="96" r="64" fill="url(#synTeal1)" opacity="0.18" filter="url(#glow1)" />
    
    <!-- Moldura arredondada estilizada -->
    <rect x="20" y="20" width="152" height="152" rx="40" fill="#0f172a" stroke="url(#synTeal1)" stroke-width="2.5" />
    
    <!-- Linhas e Nós de Sinapse formando a estrutura do Psi (Ψ) -->
    <!-- Tronco central do Psi -->
    <line x1="96" y1="46" x2="96" y2="146" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round" />
    
    <!-- Arco sináptico com nós -->
    <path d="M 54 78 C 54 126, 138 126, 138 78" fill="none" stroke="url(#synPurple1)" stroke-width="5.5" stroke-linecap="round" />
    
    <!-- Traço horizontal de estabilidade da base -->
    <line x1="72" y1="146" x2="120" y2="146" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round" />

    <!-- Nós neurais luminosos (Sinapses) -->
    <circle cx="96" cy="46" r="7" fill="#2dd4bf" filter="url(#glow1)" />
    <circle cx="54" cy="78" r="6.5" fill="#a855f7" filter="url(#glow1)" />
    <circle cx="138" cy="78" r="6.5" fill="#a855f7" filter="url(#glow1)" />
    <circle cx="96" cy="108" r="5" fill="#ffffff" />
    
    <!-- Pulso neural central -->
    <circle cx="96" cy="108" r="9" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.8" />
  </g>

  <!-- TIPOGRAFIA: Synapsis Clínico -->
  <g transform="translate(260, 110)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
      Synapsis
    </text>
    
    <!-- Badge Clínico -->
    <rect x="278" y="-46" width="152" height="38" rx="10" fill="rgba(13, 148, 136, 0.16)" stroke="#0d9488" stroke-width="1.5" />
    <text x="354" y="-22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#2dd4bf" letter-spacing="3" text-anchor="middle">
      CLÍNICO
    </text>
    
    <!-- Sub-tagline -->
    <text x="4" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="2">
      CIÊNCIA CLÍNICA • NEUROPSICOLOGIA • GESTÃO
    </text>
  </g>
</svg>
