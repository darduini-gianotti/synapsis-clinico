# ==========================================
# nginx.conf — Reverse Proxy Synapsis Clínico
# Redireciona HTTPS para o servidor Node.js em localhost
# ==========================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # Limite de upload (PDFs de documentos clínicos)
    client_max_body_size 20M;

    # ----------------------------------------
    # STAGING — staging.synapsisclinico.com.br
    # ----------------------------------------
    server {
        listen 80;
        server_name staging.synapsisclinico.com.br;

        # Redireciona HTTP → HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name staging.synapsisclinico.com.br;

        # Certificados SSL (gerados pelo Certbot)
        ssl_certificate     /etc/letsencrypt/live/staging.synapsisclinico.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/staging.synapsisclinico.com.br/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Proxy para o container staging (porta 3333)
        location / {
            proxy_pass         http://localhost:3333;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }

    # ----------------------------------------
    # PRODUCTION — app.synapsisclinico.com.br
    # ----------------------------------------
    server {
        listen 80;
        server_name app.synapsisclinico.com.br;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name app.synapsisclinico.com.br;

        ssl_certificate     /etc/letsencrypt/live/app.synapsisclinico.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.synapsisclinico.com.br/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Proxy para o container production (porta 3334)
        location / {
            proxy_pass         http://localhost:3334;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }
}
