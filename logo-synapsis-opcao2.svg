<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="orbitTeal2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="orbitViolet2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <radialGradient id="coreGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="1" />
      <stop offset="40%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#0a0f1d" rx="24" />

  <!-- SÍMBOLO: Órbitas Neurais & Faísca Sináptica -->
  <g transform="translate(40, 24)">
    <!-- Base sutil -->
    <rect x="20" y="20" width="152" height="152" rx="40" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
    
    <!-- Glow central da sinapse -->
    <circle cx="96" cy="96" r="42" fill="url(#coreGlow2)" />

    <!-- Órbita 1 (Inclinada Esquerda-Direita) -->
    <ellipse cx="96" cy="96" rx="58" ry="24" fill="none" stroke="url(#orbitTeal2)" stroke-width="5" transform="rotate(-30 96 96)" stroke-linecap="round" filter="url(#glow2)" />
    
    <!-- Órbita 2 (Inclinada Direita-Esquerda) -->
    <ellipse cx="96" cy="96" rx="58" ry="24" fill="none" stroke="url(#orbitViolet2)" stroke-width="5" transform="rotate(30 96 96)" stroke-linecap="round" />

    <!-- Núcleo de fusão cognitiva / Insight clínico -->
    <circle cx="96" cy="96" r="10" fill="#ffffff" filter="url(#glow2)" />
    <circle cx="96" cy="96" r="4.5" fill="#059669" />

    <!-- Partículas orbitais (transmissão de dados sinápticos) -->
    <circle cx="140" cy="70" r="4" fill="#34d399" filter="url(#glow2)" />
    <circle cx="52" cy="122" r="3.5" fill="#38bdf8" filter="url(#glow2)" />
    <circle cx="134" cy="126" r="3.5" fill="#818cf8" />
  </g>

  <!-- TIPOGRAFIA: Synapsis Clínico -->
  <g transform="translate(260, 110)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
      Synapsis
    </text>
    
    <!-- Badge Clínico -->
    <rect x="278" y="-46" width="152" height="38" rx="10" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1.5" />
    <text x="354" y="-22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#a5b4fc" letter-spacing="3" text-anchor="middle">
      CLÍNICO
    </text>
    
    <!-- Sub-tagline -->
    <text x="4" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="2">
      NEUROTECNOLOGIA &amp; GESTÃO CLÍNICA INTEGRADA
    </text>
  </g>
</svg>
